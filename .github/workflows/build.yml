name: Build debug APK

# Builds the app in the cloud and attaches the installable debug APK to each run, so you can
# build without installing the Android SDK / JDK locally. Runs on every push and pull request,
# and can also be started by hand from the Actions tab (workflow_dispatch).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Provides the Android SDK command-line tools and accepts the SDK licenses so the Android
      # Gradle Plugin can auto-install the platform / build-tools this project needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencfmoto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
